<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search GitHub repositories, track the ones that matter and watch their stars, issues and latest commits."
    />
    <meta
      name="theme-color"
      content="#f6f8fb"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#070b13"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Repo Radar</title>
    <style>
      /* The right background before the app loads, so dark mode never flashes white. */
      html {
        background: #f6f8fb;
        color-scheme: light;
      }
      html[data-color-scheme='dark'] {
        background: #070b13;
        color-scheme: dark;
      }
    </style>
    <script>
      // Applies the saved colour mode before first paint. MUI's
      // InitColorSchemeScript only runs during server rendering, so a client-only
      // app needs this copy. Kept in sync with packages/ui (see indexHtml.test.ts).
      (function () {
        try {
          var mode = localStorage.getItem('repo-radar:color-mode') || 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute(
            'data-color-scheme',
            isDark ? 'dark' : 'light',
          );
        } catch (error) {
          // Storage blocked: the app's own provider picks the mode once it loads.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
